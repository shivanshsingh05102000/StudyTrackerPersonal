<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study tracker login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="login-top">
        <h1>Study tracker</h1>
        <button type="button" class="theme-toggle" data-theme-toggle>
          <span data-theme-label>Theme</span>
        </button>
      </div>
      <p>Local accountability plan for Part B preparation.</p>
      <form id="login-form" class="login-form">
        <div class="demo-access" aria-label="Demo accounts">
          <div>
            <strong>Demo access</strong>
            <span>learner / learner123 - admin / admin123</span>
          </div>
          <div class="demo-actions">
            <button type="button" data-demo-login="learner">Learner</button>
            <button type="button" data-demo-login="admin">Admin</button>
          </div>
        </div>
        <label class="field">
          <span>Username</span>
          <input name="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <span class="password-row">
            <input id="password-input" name="password" type="password" autocomplete="current-password" required>
            <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </span>
        </label>
        <button type="submit">Log in</button>
        <div id="login-error" class="error-line" role="alert"></div>
      </form>
    </main>
    <script type="module">
      import "/js/theme.js";
      import { request } from "/js/api.js";

      const form = document.querySelector("#login-form");
      const error = document.querySelector("#login-error");
      const passwordInput = document.querySelector("#password-input");
      const togglePassword = document.querySelector("#toggle-password");
      const demoButtons = document.querySelectorAll("[data-demo-login]");

      togglePassword.addEventListener("click", () => {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        togglePassword.textContent = showing ? "Show" : "Hide";
        togglePassword.setAttribute("aria-label", showing ? "Show password" : "Hide password");
        togglePassword.setAttribute("aria-pressed", String(!showing));
      });

      async function logIn(body) {
        error.textContent = "";
        try {
          const session = await request("/api/login", { method: "POST", body, skipAuthRedirect: true });
          location.href = session.role === "admin" ? "/admin.html" : "/learner.html";
        } catch (err) {
          error.textContent = err.message;
        }
      }

      demoButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const username = button.dataset.demoLogin;
          const password = username === "admin" ? "admin123" : "learner123";
          form.elements.username.value = username;
          passwordInput.value = password;
          logIn({ username, password });
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        logIn(Object.fromEntries(new FormData(form).entries()));
      });
    </script>
  </body>
</html>
